name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: mypy src/recovery_mesh
      - run: pytest --cov=recovery_mesh --cov-report=term-missing
      - run: python -m py_compile app/agent.py src/recovery_mesh/*.py
      - name: Reject committed secrets
        run: |
          ! grep -RIE --exclude-dir=.git --exclude='.env.example' '(AIza[0-9A-Za-z_-]{30,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' .
      - name: Build container
        run: docker build -t recovery-mesh-ci .
