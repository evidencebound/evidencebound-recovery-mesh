[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "evidencebound-recovery-mesh"
version = "0.1.0"
description = "Trust-aware flight recorder and selective recovery engine for autonomous agent fleets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EvidenceBound contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
  "google-adk[gcp]>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "httpx>=0.28,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/recovery_mesh"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires external Google services/credentials"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["recovery_mesh"]

[tool.coverage.run]
source = ["recovery_mesh"]
branch = true
omit = ["src/recovery_mesh/google_adk.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
