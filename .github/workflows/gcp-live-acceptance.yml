name: gcp-live-acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/live-acceptance.trigger

permissions:
  contents: read
  id-token: write
  statuses: write

env:
  GOOGLE_CLOUD_PROJECT: evidencebound-rm-c977c1
  GOOGLE_CLOUD_RUN_REGION: europe-west1
  RECOVERY_MESH_SERVICE: evidencebound-recovery-mesh
  DEPLOY_WORKLOAD_IDENTITY_PROVIDER: projects/457699623691/locations/global/workloadIdentityPools/github-actions/providers/recovery-mesh
  DEPLOYER_SERVICE_ACCOUNT: recovery-mesh-deployer@evidencebound-rm-c977c1.iam.gserviceaccount.com
  AUDIT_WORKLOAD_IDENTITY_PROVIDER: projects/457699623691/locations/global/workloadIdentityPools/github-actions/providers/recovery-mesh-audit
  AUDITOR_SERVICE_ACCOUNT: recovery-mesh-auditor@evidencebound-rm-c977c1.iam.gserviceaccount.com

jobs:
  live-judge-flow:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.acceptance.outputs.run_id }}
      revision: ${{ steps.acceptance.outputs.revision }}
    steps:
      - uses: actions/checkout@v7

      - id: deployer-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}
          workload_identity_provider: ${{ env.DEPLOY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}

      - name: Run protected judge acceptance against current revision
        id: acceptance
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$RECOVERY_MESH_SERVICE" \
            --project "$GOOGLE_CLOUD_PROJECT" \
            --region "$GOOGLE_CLOUD_RUN_REGION" \
            --format='value(status.url)')"
          REVISION="$(gcloud run services describe "$RECOVERY_MESH_SERVICE" \
            --project "$GOOGLE_CLOUD_PROJECT" \
            --region "$GOOGLE_CLOUD_RUN_REGION" \
            --format='value(status.latestReadyRevisionName)')"
          printf 'LIVE_ACCEPTANCE_SERVICE_URL=%s\n' "$SERVICE_URL"
          printf 'LIVE_ACCEPTANCE_REVISION=%s\n' "$REVISION"
          printf 'revision=%s\n' "$REVISION" >> "$GITHUB_OUTPUT"

          curl --fail --silent --show-error --location \
            "$SERVICE_URL/static/app.js" \
            --output /tmp/live-app.js
          curl --fail --silent --show-error --location \
            "$SERVICE_URL/static/durable.js" \
            --output /tmp/live-durable.js
          grep -Fq 'AUTORUN_STAGE_HOLDS_MS' /tmp/live-app.js
          grep -Fq "await holdAutorunStage('baseline')" /tmp/live-app.js
          grep -Fq "await holdAutorunStage('incident')" /tmp/live-app.js
          grep -Fq "await holdAutorunStage('recovered')" /tmp/live-app.js
          grep -Fq "p.get('recover') === '1'" /tmp/live-app.js
          grep -Fq 'ACTION BLOCKED · NO RECEIPT' /tmp/live-durable.js
          grep -Fq 'REHYDRATED · TRUST VALIDATED' /tmp/live-durable.js
          printf 'HANDS_OFF_STAGED_UI=PASS revision=%s route=?autorun=stale_evidence&recover=1 durable_ledger=present\n' "$REVISION"

          export RECOVERY_MESH_JUDGE_KEY_FOR_SMOKE="$(gcloud secrets versions access 1 \
            --secret recovery-mesh-judge-key \
            --project "$GOOGLE_CLOUD_PROJECT")"
          [ -n "$RECOVERY_MESH_JUDGE_KEY_FOR_SMOKE" ] || {
            echo 'BLOCKER=judge key unavailable for live acceptance' >&2
            exit 4
          }
          echo "::add-mask::${RECOVERY_MESH_JUDGE_KEY_FOR_SMOKE}"
          ./scripts/smoke-cloud-run.sh "$SERVICE_URL" | tee /tmp/recovery-mesh-live-smoke.txt
          RUN_ID="$(sed -n 's/^RUN_ID=//p' /tmp/recovery-mesh-live-smoke.txt | tail -n1)"
          [ -n "$RUN_ID" ] || {
            echo 'BLOCKER=live smoke did not return RUN_ID' >&2
            exit 5
          }
          printf 'run_id=%s\n' "$RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'LIVE_ACCEPTANCE_RUN_ID=%s\n' "$RUN_ID"
          unset RECOVERY_MESH_JUDGE_KEY_FOR_SMOKE
          printf 'LIVE_JUDGE_ACCEPTANCE=PASS\n'
          printf 'CLOUD_RUN_MUTATIONS=NONE\n'
          printf 'BUILD_OR_DEPLOY=NONE\n'

      - name: Publish machine-readable live acceptance status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
          ACCEPTANCE_REVISION: ${{ steps.acceptance.outputs.revision }}
        run: |
          set -euo pipefail
          TARGET_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$ACCEPTANCE_OUTCOME" = "success" ]; then
            STATE=success
            DESCRIPTION="Cloud Run durable staged autorun + protected judge smoke PASS"
          else
            STATE=failure
            DESCRIPTION="Cloud Run durable staged autorun or protected judge smoke FAILED"
          fi
          python - "$STATE" "$DESCRIPTION" "$TARGET_URL" <<'PY' > /tmp/live-acceptance-status.json
          import json
          import sys

          state, description, target_url = sys.argv[1:]
          print(json.dumps({
              "state": state,
              "context": "recovery-mesh/live-acceptance",
              "description": description,
              "target_url": target_url,
          }))
          PY
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @/tmp/live-acceptance-status.json \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            >/dev/null
          printf 'LIVE_ACCEPTANCE_STATUS=%s context=recovery-mesh/live-acceptance revision=%s\n' \
            "$STATE" "${ACCEPTANCE_REVISION:-unknown}"
          printf 'LIVE_ACCEPTANCE_ACTIONS_RUN=%s\n' "$TARGET_URL"

  cloud-proof:
    needs: live-judge-flow
    runs-on: ubuntu-latest
    env:
      RECOVERY_MESH_PROOF_RUN_ID: ${{ needs.live-judge-flow.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7

      - id: auditor-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}
          workload_identity_provider: ${{ env.AUDIT_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.AUDITOR_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}

      - name: Capture exact-run Google Cloud proof receipt
        run: bash ./scripts/gcp-proof-receipt.sh
