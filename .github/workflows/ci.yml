name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: mypy src/recovery_mesh
      - run: pytest --cov=recovery_mesh --cov-report=term-missing
      - run: python -m py_compile app/agent.py src/recovery_mesh/*.py scripts/benchmark-scale.py
      - name: Validate shell entrypoints
        run: bash -n scripts/gcp-owner-bootstrap.sh scripts/gcp-live-preflight.sh scripts/deploy-cloud-run.sh scripts/smoke-cloud-run.sh scripts/gcp-proof-receipt.sh scripts/register-agent-registry.sh scripts/create-project-budget-alert.sh
      - name: Validate Flight Recorder JavaScript
        run: node --check static/app.js
      - name: Verify deterministic fleet-scale receipt
        run: |
          PYTHONPATH=src python scripts/benchmark-scale.py > /tmp/scale-probe.json
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path('/tmp/scale-probe.json').read_text())
          assert receipt['measurement_class'] == 'deterministic_synthetic_scale_probe', receipt
          assert receipt['synthetic_agent_checkpoints'] == 100, receipt
          assert receipt['affected_agent_checkpoints'] == 14, receipt
          assert receipt['reused_agent_checkpoints'] == 86, receipt
          assert receipt['blocked_action_nodes'] == 1, receipt
          print('SCALE_PROBE=PASS agents=100 affected=14 reused=86 blocked_actions=1')
          PY
      - name: Reject committed secrets
        run: |
          ! grep -RIE --exclude-dir=.git --exclude='.env.example' '(AIza[0-9A-Za-z_-]{30,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' .
      - name: Build container
        run: docker build -t recovery-mesh-ci .
