name: gcp-runtime-failure-audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gcp-runtime-failure-audit.yml

permissions:
  contents: read
  id-token: write

env:
  GOOGLE_CLOUD_PROJECT: evidencebound-rm-c977c1
  GOOGLE_CLOUD_RUN_REGION: europe-west1
  RECOVERY_MESH_SERVICE: evidencebound-recovery-mesh
  AUDIT_WORKLOAD_IDENTITY_PROVIDER: projects/457699623691/locations/global/workloadIdentityPools/github-actions/providers/recovery-mesh-audit
  AUDITOR_SERVICE_ACCOUNT: recovery-mesh-auditor@evidencebound-rm-c977c1.iam.gserviceaccount.com

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}
          workload_identity_provider: ${{ env.AUDIT_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.AUDITOR_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}

      - name: Capture current service and failing request logs
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$GOOGLE_CLOUD_PROJECT"
          REGION="$GOOGLE_CLOUD_RUN_REGION"
          SERVICE="$RECOVERY_MESH_SERVICE"

          echo 'RUNTIME_AUDIT_MODE=READ_ONLY'
          gcloud run services describe "$SERVICE" \
            --project "$PROJECT" \
            --region "$REGION" \
            --format='yaml(status.url,status.latestReadyRevisionName,status.conditions,status.traffic)'

          echo '===== CLOUD_RUN_REQUEST_AND_APP_LOGS_30M ====='
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="'"$SERVICE"'" AND timestamp>="2026-08-14T19:00:00Z"' \
            --project "$PROJECT" \
            --limit=300 \
            --order=asc \
            --format='yaml(timestamp,severity,logName,resource.labels.revision_name,httpRequest.requestMethod,httpRequest.requestUrl,httpRequest.status,httpRequest.latency,httpRequest.userAgent,trace,textPayload,jsonPayload)' \
            || true

          echo '===== ERROR_LOGS_30M ====='
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="'"$SERVICE"'" AND timestamp>="2026-08-14T19:00:00Z" AND severity>=ERROR' \
            --project "$PROJECT" \
            --limit=100 \
            --order=asc \
            --format='yaml(timestamp,severity,logName,resource.labels.revision_name,httpRequest.requestMethod,httpRequest.requestUrl,httpRequest.status,trace,textPayload,jsonPayload)' \
            || true

          echo 'RUNTIME_AUDIT_COMPLETE=TRUE'
          echo 'CLOUD_RUN_MUTATIONS=NONE'
          echo 'MODEL_CALLS=NONE'
